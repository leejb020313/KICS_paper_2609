[project]
name = "cwcascade"
version = "1.0.0"
description = "Selective fusion of a low-cost classifier and a frontier LLM for check-worthy claim detection (KICS 2026)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "sentence-transformers",
    "pandas",
]

[project.optional-dependencies]
scoring = ["requests"]
paper = ["matplotlib", "pymupdf"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cwcascade"]
